          /** Translate by key. Reads the observable language setting, so the UI updates when it changes. */
          fun tr(key: String, vararg args: Any): String {
              val map = if ((Store.peek()?.language ?: "en") == "ar") STR_AR else STR_EN
              val fmt = map[key] ?: STR_EN[key] ?: key
              return if (args.isEmpty()) fmt else String.format(Locale.ROOT, fmt, *args)
          }

          object Tier {
              const val GREEN = 0
              const val YELLOW = 1
              const val RED = 2
          }

          object LockKind {
              const val NONE = 0
              const val COOLDOWN = 1
              const val QUOTA = 2
              const val FOCUS = 3
          }

          data class Lock(val kind: Int, val remainingMs: Long = 0L)

          /** Lower-case + light Arabic normalisation so searching works for both languages. */
          fun normalize(s: String): String {
              val sb = StringBuilder(s.length)
              for (c in s.lowercase(Locale.ROOT)) {
                  when {
                      c in '\u064B'..'\u065F' || c == '\u0640' -> Unit
                      c == '\u0623' || c == '\u0625' || c == '\u0622' -> sb.append('\u0627')
                      c == '\u0649' -> sb.append('\u064A')
                      c == '\u0629' -> sb.append('\u0647')
                      else -> sb.append(c)
                  }
              }
              return sb.toString()
          }

          data class AppEntry(val pkg: String, val label: String) {
              val key: String = normalize(label)
          }

          /** All persisted settings and state. Reads are observable by Compose. */
          class Store private constructor(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
              private var rev by mutableIntStateOf(0)

              @Suppress("UNUSED_VARIABLE")
              private fun <T> read(f: () -> T): T {
                  val r = rev
                  return f()
              }

              private fun write(block: SharedPreferences.Editor.() -> Unit) {
                  val e = sp.edit()
                  e.block()
                  e.apply()
                  rev++
              }

              var delaySec: Int
                  get() = read { sp.getInt("delay", 5) }
                  set(v) = write { putInt("delay", v.coerceIn(3, 10)) }

              var cooldownMin: Int
                  get() = read { sp.getInt("cooldown", 15) }
                  set(v) = write { putInt("cooldown", v.coerceIn(5, 60)) }

              var focusMode: Boolean
                  get() = read { sp.getBoolean("focus", false) }
                  set(v) = write { putBoolean("focus", v) }

              var widgetOn: Boolean
                  get() = read { sp.getBoolean("widget_on", false) }
                  set(v) = write { putBoolean("widget_on", v) }

              var widgetId: Int
                  get() = read { sp.getInt("widget_id", -1) }
                  set(v) = write { putInt("widget_id", v) }

              var language: String
                  get() = read { sp.getString("lang", "en") ?: "en" }
                  set(v) = write { putString("lang", v) }

              fun tier(pkg: String): Int = read { sp.getInt("tier:$pkg", Tier.GREEN) }
              fun setTier(pkg: String, t: Int) = write {
                  if (t == Tier.GREEN) remove("tier:$pkg") else putInt("tier:$pkg", t)
              }

              fun quota(pkg: String): Int = read { sp.getInt("quota:$pkg", 0) }
              fun setQuota(pkg: String, minutes: Int) = write { putInt("quota:$pkg", minutes.coerceIn(0, 120)) }

              fun cooldownUntil(pkg: String): Long = read { sp.getLong("cd:$pkg", 0L) }
              fun setCooldownUntil(pkg: String, t: Long) = write { putLong("cd:$pkg", t) }

              fun usedMs(pkg: String): Long = read { sp.getLong("used:$pkg:${LocalDate.now()}", 0L) }
              fun addUsedMs(pkg: String, ms: Long) = write {
                  val k = "used:$pkg:${LocalDate.now()}"
                  putLong(k, sp.getLong(k, 0L) + ms)
              }

              val sessionPkg: String? get() = read { sp.getString("s_pkg", null) }
              val sessionStart: Long get() = read { sp.getLong("s_start", 0L) }
              val sessionEnd: Long get() = read { sp.getLong("s_end", 0L) }
              fun setSession(pkg: String, start: Long, end: Long) = write {
                  putString("s_pkg", pkg); putLong("s_start", start); putLong("s_end", end)
              }
              fun clearSession() = write { remove("s_pkg"); remove("s_start"); remove("s_end") }

              fun history(): List<String> = read {
                  (sp.getString("hist", "") ?: "").split('\u0001').filter { it.isNotBlank() }
              }
              fun addHistory(text: String) {
                  val t = text.trim().replace('\u0001', ' ')
                  val list = listOf(t) + history().filter { it != t }
                  write { putString("hist", list.take(30).joinToString("\u0001")) }
              }

              companion object {
                  private const val FILE = "focus_prefs"
                  @Volatile private var inst: Store? = null

                  fun get(ctx: Context): Store =
                      inst ?: synchronized(this) {
                          inst ?: Store(ctx.applicationContext ?: ctx).also { inst = it }
                      }

                  fun peek(): Store? = inst

                  /** Safe to call from attachBaseContext (no Store instance needed). */
                  fun languageOf(ctx: Context): String =
                      ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).getString("lang", "en") ?: "en"
              }
          }

          /** All the tier / session / cooldown / quota rules live here. */
          object Policy {
              const val YELLOW_MAX = 60
              const val RED_MAX = 30

              fun sessionActive(s: Store, now: Long) = s.sessionPkg != null && now < s.sessionEnd
              fun sessionActiveFor(s: Store, pkg: String, now: Long) = s.sessionPkg == pkg && now < s.sessionEnd

              fun lock(s: Store, pkg: String, now: Long): Lock {
                  val t = s.tier(pkg)
                  if (t == Tier.GREEN) return Lock(LockKind.NONE)
                  if (s.focusMode) return Lock(LockKind.FOCUS)
                  if (t == Tier.RED) {
                      val cd = s.cooldownUntil(pkg)
                      if (cd > now) return Lock(LockKind.COOLDOWN, cd - now)
                      val q = s.quota(pkg)
                      if (q > 0 && s.usedMs(pkg) >= q * 60_000L) return Lock(LockKind.QUOTA)
                  }
                  return Lock(LockKind.NONE)
              }

              fun maxMinutes(s: Store, pkg: String): Int {
                  if (s.tier(pkg) != Tier.RED) return YELLOW_MAX
                  val q = s.quota(pkg)
                  if (q <= 0) return RED_MAX
                  val remaining = ((q * 60_000L - s.usedMs(pkg)) / 60_000L).toInt()
                  return remaining.coerceIn(1, RED_MAX)
              }

              fun startSession(s: Store, pkg: String, minutes: Int, intention: String, now: Long) {
                  if (s.sessionPkg != null) endSession(s, now)
                  var dur = minutes * 60_000L
                  val q = s.quota(pkg)
                  if (s.tier(pkg) == Tier.RED && q > 0) {
                      val remaining = q * 60_000L - s.usedMs(pkg)
                      dur = minOf(dur, maxOf(15_000L, remaining))
                  }
                  s.setSession(pkg, now, now + dur)
                  s.addHistory(intention)
              }

              /** Ends the running session. Red apps get usage booked and a cooldown. Returns the package. */
              fun endSession(s: Store, now: Long): String? {
                  val pkg = s.sessionPkg ?: return null
                  val elapsed = (minOf(now, s.sessionEnd) - s.sessionStart).coerceAtLeast(0L)
                  if (s.tier(pkg) == Tier.RED) {
                      s.addUsedMs(pkg, elapsed)
                      s.setCooldownUntil(pkg, now + s.cooldownMin * 60_000L)
                  }
                  s.clearSession()
                  return pkg
              }

              fun endIfExpired(s: Store, now: Long): String? =
                  if (s.sessionPkg != null && now >= s.sessionEnd) endSession(s, now) else null
          }

          object Apps {
              fun load(ctx: Context): List<AppEntry> {
                  val pm = ctx.packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  return pm.queryIntentActivities(i, 0)
                      .map { AppEntry(it.activityInfo.packageName, it.loadLabel(pm).toString()) }
                      .filter { it.pkg != ctx.packageName }
                      .distinctBy { it.pkg }
                      .sortedBy { it.key }
              }

              /** Prefix matches first, then matches anywhere else. Each group stays alphabetical. */
              fun search(apps: List<AppEntry>, query: String): List<AppEntry> {
                  val q = normalize(query.trim())
                  if (q.isEmpty()) return emptyList()
                  val hits = apps.filter { it.key.contains(q) }
                  val (starts, rest) = hits.partition { it.key.startsWith(q) }
                  return starts + rest
              }

              fun launch(ctx: Context, pkg: String, fresh: Boolean): Boolean {
                  val i = ctx.packageManager.getLaunchIntentForPackage(pkg) ?: return false
                  val extra = if (fresh) Intent.FLAG_ACTIVITY_CLEAR_TASK else 0
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or extra)
                  return try { ctx.startActivity(i); true } catch (e: Exception) { false }
              }
          }

          object Usage {
              data class Report(val todayMin: Long, val avgMin: Long)

              @Suppress("DEPRECATION")
              fun hasAccess(ctx: Context): Boolean {
                  val ops = ctx.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = if (Build.VERSION.SDK_INT >= 29) {
                      ops.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName)
                  } else {
                      ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName)
                  }
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              fun report(ctx: Context): Report {
                  val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val now = System.currentTimeMillis()
                  val totals = (0..7).map { d ->
                      val start = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
                          set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                          add(Calendar.DAY_OF_YEAR, -d)
                      }
                      val end = if (d == 0) now else (start.clone() as Calendar).apply {
                          add(Calendar.DAY_OF_YEAR, 1)
                      }.timeInMillis
                      usm.queryAndAggregateUsageStats(start.timeInMillis, end).values
                          .filter { it.packageName != ctx.packageName }
                          .sumOf { it.totalTimeInForeground }
                  }
                  val today = totals[0] / 60_000L
                  val avg = totals.drop(1).sum() / 7L / 60_000L
                  return Report(today, avg)
              }
          }

          /**
           * Enforcement layer:
           *  1. Ends sessions when the timer runs out and throws the user back Home.
           *  2. Blocks the Recents screen entirely (sends Home the moment it opens).
           *  3. Sends the user Home if a Yellow/Red app is in front without an active session.
           */
          class GuardService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var lastHome = 0L

              private val tick = object : Runnable {
                  override fun run() {
                      val store = Store.get(this@GuardService)
                      val pkg = Policy.endIfExpired(store, System.currentTimeMillis())
                      if (pkg != null) {
                          goHome()
                          handler.postDelayed({ killBackground(pkg) }, 1200)
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onServiceConnected() {
                  running = true
                  handler.removeCallbacksAndMessages(null)
                  handler.post(tick)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = e.packageName?.toString() ?: return
                  val cls = e.className?.toString().orEmpty()

                  // Recents / Overview screen (class names differ per manufacturer, all contain "Recents").
                  if (cls.contains("Recents", ignoreCase = true) ||
                      (pkg == "com.android.systemui" && cls.contains("recent", ignoreCase = true))
                  ) {
                      goHome()
                      return
                  }

                  if (pkg == packageName) return
                  val store = Store.get(this)
                  if (store.tier(pkg) == Tier.GREEN) return
                  if (Policy.sessionActiveFor(store, pkg, System.currentTimeMillis())) return
                  goHome()
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  return super.onUnbind(intent)
              }

              private fun goHome() {
                  val now = System.currentTimeMillis()
                  if (now - lastHome < 300) return
                  lastHome = now
                  performGlobalAction(GLOBAL_ACTION_HOME)
              }

              private fun killBackground(pkg: String) {
                  try {
                      (getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).killBackgroundProcesses(pkg)
                  } catch (e: Exception) {
                  }
              }

              companion object {
                  @Volatile var running = false

                  fun isEnabled(ctx: Context): Boolean {
                      val enabled = Settings.Secure.getString(
                          ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      return enabled.contains(ctx.packageName)
                  }
              }
          }

          const val MIN_CHARS = 6

          object Ui {
              val bg = Color(0xFF0A0A0A)
              val surface = Color(0xFF141414)
              val border = Color(0xFF2A2A2A)
              val text = Color(0xFFEDEDED)
              val dim = Color(0xFF8A8A8A)
              val green = Color(0xFF4ADE80)
              val yellow = Color(0xFFFACC15)
              val red = Color(0xFFF87171)
              fun tierColor(t: Int) = when (t) {
                  Tier.YELLOW -> yellow
                  Tier.RED -> red
                  else -> green
              }
          }

          class Env(
              val store: Store,
              val host: AppWidgetHost,
              val awm: AppWidgetManager,
              val homeSignal: State<Int>,
              val pickWidget: (AppWidgetProviderInfo) -> Unit,
              val clearWidget: () -> Unit,
              val setLanguage: (String) -> Unit,
          )

          class Gate {
              var unlocked by mutableStateOf(false)
              var armed by mutableStateOf(false)
              var left by mutableIntStateOf(5)
              fun reset() { unlocked = false; armed = false; left = 5 }
          }

          @Composable
          fun FocusTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Color.White, onPrimary = Color.Black,
                      background = Ui.bg, onBackground = Ui.text,
                      surface = Ui.surface, onSurface = Ui.text,
                      surfaceVariant = Ui.surface, outline = Ui.border,
                  ),
                  content = content,
              )
          }

          // ---------- small building blocks ----------

          @Composable
          fun T(
              text: String, size: Int = 16, color: Color = Ui.text, modifier: Modifier = Modifier,
              weight: FontWeight = FontWeight.Normal, maxLines: Int = Int.MAX_VALUE, align: TextAlign? = null,
          ) {
              Text(
                  text, modifier, color = color, fontSize = size.sp, fontFamily = FontFamily.Monospace,
                  fontWeight = weight, maxLines = maxLines, overflow = TextOverflow.Ellipsis, textAlign = align,
              )
          }

          @Composable
          fun Dot(color: Color, size: androidx.compose.ui.unit.Dp) {
              Box(Modifier.size(size).clip(CircleShape).background(color))
          }

          @Composable
          fun Btn(text: String, onClick: () -> Unit, filled: Boolean = false, enabled: Boolean = true, modifier: Modifier = Modifier) {
              val shape = RoundedCornerShape(12.dp)
              Box(
                  modifier
                      .alpha(if (enabled) 1f else 0.4f)
                      .clip(shape)
                      .background(if (filled) Color.White else Color.Transparent)
                      .border(1.dp, if (filled) Color.White else Ui.border, shape)
                      .clickable(enabled = enabled, onClick = onClick)
                      .padding(horizontal = 18.dp, vertical = 12.dp),
                  contentAlignment = Alignment.Center,
              ) { T(text, 14, if (filled) Color.Black else Ui.text) }
          }

          @Composable
          fun Field(
              value: String, onChange: (String) -> Unit, hint: String, modifier: Modifier = Modifier,
              ime: ImeAction = ImeAction.Done, onAction: () -> Unit = {}, size: Int = 16,
              bg: Color = Ui.surface, singleLine: Boolean = true,
          ) {
              val shape = RoundedCornerShape(14.dp)
              BasicTextField(
                  value = value,
                  onValueChange = onChange,
                  modifier = modifier.fillMaxWidth().clip(shape).background(bg).border(1.dp, Ui.border, shape),
                  singleLine = singleLine,
                  textStyle = TextStyle(color = Ui.text, fontSize = size.sp, fontFamily = FontFamily.Monospace),
                  cursorBrush = SolidColor(Color.White),
                  keyboardOptions = KeyboardOptions(
                      capitalization = KeyboardCapitalization.None, autoCorrect = false, imeAction = ime,
                  ),
                  keyboardActions = KeyboardActions(onSearch = { onAction() }, onDone = { onAction() }),
                  decorationBox = { inner ->
                      Box(Modifier.padding(horizontal = 18.dp, vertical = 14.dp)) {
                          if (value.isEmpty()) T(hint, size, Ui.dim)
                          inner()
                      }
                  },
              )
          }

          fun mmss(ms: Long): String {
              val s = (ms.coerceAtLeast(0L) + 999L) / 1000L
              return String.format(Locale.US, "%d:%02d", s / 60, s % 60)
          }

          // ---------- root ----------

          @Composable
          fun LauncherRoot(env: Env) {
              val ctx = LocalContext.current
              val store = env.store
              val scope = rememberCoroutineScope()
              val signal = env.homeSignal.value

              var apps by remember { mutableStateOf<List<AppEntry>>(emptyList()) }
              LaunchedEffect(signal) { apps = withContext(Dispatchers.IO) { Apps.load(ctx) } }

              var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
              LaunchedEffect(Unit) {
                  while (true) {
                      now = System.currentTimeMillis()
                      // If the guard service runs it owns expiry (it also sends the user Home).
                      if (!GuardService.running) Policy.endIfExpired(store, now)
                      delay(1000)
                  }
              }

              val drawer = rememberDrawerState(DrawerValue.Closed)
              val gate = remember { Gate() }
              var breathing by remember { mutableStateOf<AppEntry?>(null) }
              var asking by remember { mutableStateOf<AppEntry?>(null) }

              // Every time the drawer closes the settings gate re-locks.
              LaunchedEffect(drawer.currentValue) {
                  if (drawer.currentValue == DrawerValue.Closed) gate.reset()
              }
              // Returning Home cancels half-finished flows and closes the drawer.
              LaunchedEffect(signal) {
                  breathing = null
                  asking = null
                  drawer.close()
              }

              // Back does nothing on the home screen (except closing the drawer).
              BackHandler(enabled = true) {
                  if (drawer.isOpen) scope.launch { drawer.close() }
              }

              fun choose(app: AppEntry) {
                  val t = System.currentTimeMillis()
                  if (Policy.sessionActiveFor(store, app.pkg, t)) {
                      Apps.launch(ctx, app.pkg, false)
                      return
                  }
                  if (Policy.lock(store, app.pkg, t).kind != LockKind.NONE) return
                  if (store.tier(app.pkg) == Tier.GREEN) Apps.launch(ctx, app.pkg, false) else breathing = app
              }

              Box(Modifier.fillMaxSize().background(Ui.bg)) {
                  ModalNavigationDrawer(
                      drawerState = drawer,
                      drawerContent = {
                          ModalDrawerSheet(drawerContainerColor = Ui.surface, drawerContentColor = Ui.text) {
                              DrawerContent(
                                  env, apps, gate,
                                  open = drawer.currentValue == DrawerValue.Open || drawer.targetValue == DrawerValue.Open,
                              )
                          }
                      },
                  ) {
                      HomeScreen(env, apps, now) { choose(it) }
                  }

                  breathing?.let { app ->
                      Breathing(
                          app, store.delaySec,
                          onDone = { breathing = null; asking = app },
                          onCancel = { breathing = null },
                      )
                  }
                  asking?.let { app ->
                      IntentionDialog(
                          app, store,
                          onCancel = { asking = null },
                          onBegin = { text, minutes ->
                              Policy.startSession(store, app.pkg, minutes, text, System.currentTimeMillis())
                              asking = null
                              Apps.launch(ctx, app.pkg, true)
                          },
                      )
                  }
              }
          }

          // ---------- home screen ----------

          @Composable
          fun HomeScreen(env: Env, apps: List<AppEntry>, now: Long, onChoose: (AppEntry) -> Unit) {
              val store = env.store
              val focus = LocalFocusManager.current
              val kb = LocalSoftwareKeyboardController.current
              var query by remember { mutableStateOf("") }
              val signal = env.homeSignal.value

              // Never auto-focus: on every return to Home, drop focus + keyboard + query.
              LaunchedEffect(signal) {
                  query = ""
                  focus.clearFocus(force = true)
                  kb?.hide()
              }

              val results = remember(apps, query) { Apps.search(apps, query) }
              val typing = query.isNotBlank()

              fun open(app: AppEntry) {
                  query = ""
                  focus.clearFocus(force = true)
                  kb?.hide()
                  onChoose(app)
              }

              BoxWithConstraints(
                  Modifier
                      .fillMaxSize()
                      .background(Ui.bg)
                      .systemBarsPadding()
                      .imePadding()
                      .pointerInput(Unit) {
                          detectTapGestures { focus.clearFocus(force = true); kb?.hide() }
                      },
              ) {
                  val tablet = maxWidth >= 600.dp
                  val roomy = maxHeight >= 430.dp

                  Column(
                      Modifier
                          .align(Alignment.TopCenter)
                          .fillMaxHeight()
                          .widthIn(max = if (tablet) 600.dp else 480.dp)
                          .fillMaxWidth()
                          .padding(horizontal = 24.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      if (typing) Spacer(Modifier.height(12.dp)) else Spacer(Modifier.weight(1f))

                      Clock(now, compact = typing, big = tablet)

                      // Active session indicator (only while a timed app is running)
                      val sp = store.sessionPkg
                      if (sp != null && now < store.sessionEnd) {
                          val entry = apps.firstOrNull { it.pkg == sp }
                          val shape = RoundedCornerShape(50)
                          Row(
                              Modifier
                                  .padding(top = 16.dp)
                                  .clip(shape)
                                  .border(1.dp, Ui.border, shape)
                                  .clickable { entry?.let(onChoose) }
                                  .padding(horizontal = 14.dp, vertical = 8.dp),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Dot(Ui.tierColor(store.tier(sp)), 8.dp)
                              Spacer(Modifier.width(8.dp))
                              T("${entry?.label ?: sp} · ${mmss(store.sessionEnd - now)}", 14, Ui.text, maxLines = 1)
                          }
                      }

                      // Optional widget container
                      if (!typing && roomy && store.widgetOn && store.widgetId != -1) {
                          Spacer(Modifier.height(24.dp))
                          key(store.widgetId) { WidgetBox(env, store.widgetId, tablet) }
                      }

                      Spacer(Modifier.height(if (typing) 16.dp else 32.dp))
                      Field(
                          value = query,
                          onChange = { query = it },
                          hint = tr("search_hint"),
                          ime = ImeAction.Search,
                          onAction = { results.firstOrNull()?.let { open(it) } },
                          size = 18,
                      )

                      if (typing) {
                          val listState = rememberLazyListState()
                          LaunchedEffect(listState.isScrollInProgress) {
                              if (listState.isScrollInProgress) kb?.hide()
                          }
                          LazyColumn(
                              Modifier.weight(1f).fillMaxWidth(),
                              state = listState,
                              contentPadding = PaddingValues(vertical = 12.dp),
                          ) {
                              items(results, key = { it.pkg }) { app ->
                                  AppRow(store, app, now) { open(app) }
                              }
                          }
                      } else {
                          Spacer(Modifier.weight(1.4f))
                      }
                  }
              }
          }

          @Composable
          fun Clock(now: Long, compact: Boolean, big: Boolean) {
              val ctx = LocalContext.current
              val loc = Locale.getDefault()
              val is24 = DateFormat.is24HourFormat(ctx)
              val z = Instant.ofEpochMilli(now).atZone(ZoneId.systemDefault())
              val time = DateTimeFormatter.ofPattern(if (is24) "HH:mm" else "h:mm", loc).format(z)
              val date = DateTimeFormatter.ofPattern("EEEE d MMMM", loc).format(z)
              T(time, if (compact) 36 else if (big) 96 else 64, Ui.text, weight = FontWeight.Light)
              if (!compact) T(date, if (big) 18 else 14, Ui.dim)
          }

          @Composable
          fun AppRow(store: Store, app: AppEntry, now: Long, onClick: () -> Unit) {
              val tier = store.tier(app.pkg)
              val active = Policy.sessionActiveFor(store, app.pkg, now)
              val lock = Policy.lock(store, app.pkg, now)
              val disabled = lock.kind != LockKind.NONE && !active
              val parts = mutableListOf<String>()
              if (active) {
                  parts += tr("running")
              } else {
                  when (lock.kind) {
                      LockKind.COOLDOWN -> parts += tr("locked_cooldown", mmss(lock.remainingMs))
                      LockKind.QUOTA -> parts += tr("locked_quota")
                      LockKind.FOCUS -> parts += tr("locked_focus")
                  }
              }
              val q = store.quota(app.pkg)
              if (tier == Tier.RED && q > 0) {
                  parts += tr("quota_fmt", (store.usedMs(app.pkg) / 60_000L).toInt(), q)
              }
              Row(
                  Modifier
                      .fillMaxWidth()
                      .alpha(if (disabled) 0.35f else 1f)
                      .clickable(enabled = !disabled, onClick = onClick)
                      .padding(vertical = 14.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Dot(Ui.tierColor(tier), 8.dp)
                  Spacer(Modifier.width(14.dp))
                  T(app.label, 18, Ui.text, Modifier.weight(1f), maxLines = 1)
                  if (parts.isNotEmpty()) {
                      Spacer(Modifier.width(8.dp))
                      T(parts.joinToString(" · "), 12, Ui.dim, maxLines = 1)
                  }
              }
          }

          @Composable
          fun WidgetBox(env: Env, id: Int, tablet: Boolean) {
              val shape = RoundedCornerShape(16.dp)
              AndroidView(
                  factory = { c ->
                      val info = env.awm.getAppWidgetInfo(id)
                      if (info == null) android.view.View(c) else env.host.createView(c, id, info)
                  },
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(if (tablet) 220.dp else 150.dp)
                      .clip(shape)
                      .border(1.dp, Ui.border, shape),
              )
          }

          // ---------- pre-session flow ----------

          @Composable
          fun Breathing(app: AppEntry, seconds: Int, onDone: () -> Unit, onCancel: () -> Unit) {
              var left by remember { mutableIntStateOf(seconds) }
              val done by rememberUpdatedState(onDone)
              LaunchedEffect(Unit) {
                  while (left > 0) { delay(1000); left-- }
                  done()
              }
              BackHandler { onCancel() }

              val transition = rememberInfiniteTransition(label = "breath")
              val scale by transition.animateFloat(
                  initialValue = 0.55f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(2000, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "scale",
              )
              val inhale = ((seconds - left) / 2) % 2 == 0

              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Color(0xFA0A0A0A))
                      .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {}
                      .systemBarsPadding(),
                  contentAlignment = Alignment.Center,
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      T(app.label, 14, Ui.dim)
                      Spacer(Modifier.height(24.dp))
                      Box(Modifier.size(200.dp), contentAlignment = Alignment.Center) {
                          Box(
                              Modifier
                                  .fillMaxSize()
                                  .graphicsLayer { scaleX = scale; scaleY = scale }
                                  .border(1.5.dp, Color.White, CircleShape)
                          )
                          T(left.toString(), 48, Ui.text, weight = FontWeight.Light)
                      }
                      Spacer(Modifier.height(24.dp))
                      T(tr(if (inhale) "breathe_in" else "breathe_out"), 18, Ui.dim)
                      Spacer(Modifier.height(40.dp))
                      Btn(tr("cancel"), onCancel)
                  }
              }
          }

          @Composable
          fun IntentionDialog(
              app: AppEntry, store: Store,
              onCancel: () -> Unit, onBegin: (String, Int) -> Unit,
          ) {
              val maxMin = remember { Policy.maxMinutes(store, app.pkg) }
              var minutes by remember { mutableIntStateOf(minOf(5, maxMin)) }
              var text by remember { mutableStateOf("") }
              val trimmed = text.trim()
              // At least 6 characters and not just one or two repeated letters.
              val valid = trimmed.length >= MIN_CHARS && trimmed.toSet().size >= 3
              val hist = remember { store.history() }
              val fr = remember { FocusRequester() }
              LaunchedEffect(Unit) { runCatching { fr.requestFocus() } }

              Dialog(onDismissRequest = onCancel, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Box(Modifier.fillMaxWidth().padding(16.dp), contentAlignment = Alignment.Center) {
                      Surface(
                          Modifier.widthIn(max = 480.dp).fillMaxWidth(),
                          shape = RoundedCornerShape(18.dp),
                          color = Ui.surface,
                          border = BorderStroke(1.dp, Ui.border),
                      ) {
                          Column(Modifier.padding(20.dp).verticalScroll(rememberScrollState())) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Dot(Ui.tierColor(store.tier(app.pkg)), 10.dp)
                                  Spacer(Modifier.width(10.dp))
                                  T(tr("intention_title", app.label), 18, Ui.text, Modifier.weight(1f))
                              }
                              Spacer(Modifier.height(16.dp))

                              if (hist.isNotEmpty()) {
                                  T(tr("history_title"), 12, Ui.dim)
                                  Spacer(Modifier.height(6.dp))
                                  // Fixed max height + own scroll: can never push the dialog around.
                                  Column(
                                      Modifier
                                          .fillMaxWidth()
                                          .heightIn(max = 96.dp)
                                          .clip(RoundedCornerShape(10.dp))
                                          .border(1.dp, Ui.border, RoundedCornerShape(10.dp))
                                          .verticalScroll(rememberScrollState())
                                          .padding(10.dp),
                                  ) {
                                      hist.forEach { T("• $it", 13, Ui.dim, Modifier.padding(vertical = 2.dp)) }
                                  }
                                  Spacer(Modifier.height(16.dp))
                              }

                              Field(
                                  value = text, onChange = { text = it },
                                  hint = tr("intention_hint"),
                                  modifier = Modifier.focusRequester(fr),
                                  bg = Ui.bg,
                              )
                              Spacer(Modifier.height(4.dp))
                              T(
                                  tr("intention_count", trimmed.length.coerceAtMost(MIN_CHARS), MIN_CHARS),
                                  11, if (valid) Ui.green else Ui.dim,
                              )

                              Spacer(Modifier.height(16.dp))
                              T(tr("duration_fmt", minutes), 14, Ui.text)
                              if (maxMin > 1) {
                                  Slider(
                                      value = minutes.toFloat(),
                                      onValueChange = { minutes = Math.round(it) },
                                      valueRange = 1f..maxMin.toFloat(),
                                      steps = maxMin - 2,
                                      colors = sliderColors(),
                                  )
                              }

                              Spacer(Modifier.height(16.dp))
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp, Alignment.End)) {
                                  Btn(tr("cancel"), onCancel)
                                  Btn(
                                      tr("begin"), { onBegin(trimmed, minutes) },
                                      filled = true, enabled = valid,
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun sliderColors() = SliderDefaults.colors(
              thumbColor = Color.White,
              activeTrackColor = Color.White,
              inactiveTrackColor = Ui.border,
              activeTickColor = Color.Transparent,
              inactiveTickColor = Color.Transparent,
          )

          @Composable
          fun DrawerContent(env: Env, apps: List<AppEntry>, gate: Gate, open: Boolean) {
              val ctx = LocalContext.current
              val store = env.store
              val signal = env.homeSignal.value

              var hasUsage by remember { mutableStateOf(false) }
              var report by remember { mutableStateOf<Usage.Report?>(null) }
              var guardOn by remember { mutableStateOf(false) }
              var filter by remember { mutableStateOf("") }
              var picker by remember { mutableStateOf(false) }

              LaunchedEffect(open, signal) {
                  if (open) {
                      guardOn = GuardService.isEnabled(ctx)
                      hasUsage = Usage.hasAccess(ctx)
                      report = if (hasUsage) withContext(Dispatchers.IO) { Usage.report(ctx) } else null
                  }
              }

              // 5-second anti-impulse countdown
              LaunchedEffect(gate.armed) {
                  if (gate.armed) {
                      gate.left = 5
                      while (gate.left > 0) { delay(1000); gate.left-- }
                      gate.unlocked = true
                      gate.armed = false
                  }
              }

              val shown = remember(apps, filter) {
                  val q = normalize(filter.trim())
                  if (q.isEmpty()) apps else apps.filter { it.key.contains(q) }
              }

              LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(20.dp)) {
                  item {
                      T(tr("drawer_title"), 22, Ui.text, weight = androidx.compose.ui.text.font.FontWeight.Light)
                      Spacer(Modifier.height(20.dp))
                  }

                  // ----- usage report -----
                  item {
                      Panel {
                          T(tr("report_title"), 14, Ui.dim)
                          Spacer(Modifier.height(10.dp))
                          val r = report
                          if (!hasUsage) {
                              T(tr("report_no_perm"), 13, Ui.text)
                              Spacer(Modifier.height(10.dp))
                              Btn(tr("grant_usage"), {
                                  ctx.startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              })
                          } else if (r != null) {
                              T(tr("report_today") + ": " + tr("min_fmt", r.todayMin.toInt()), 15)
                              Spacer(Modifier.height(4.dp))
                              T(tr("report_avg") + ": " + tr("min_fmt", r.avgMin.toInt()), 15)
                              Spacer(Modifier.height(8.dp))
                              val diff = (r.avgMin - r.todayMin).toInt()
                              if (diff >= 0) T(tr("report_saved", diff), 14, Ui.green)
                              else T(tr("report_exceeded", -diff), 14, Ui.red)
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }

                  // ----- guard service -----
                  item {
                      Panel {
                          T(tr("guard_title"), 14, Ui.dim)
                          Spacer(Modifier.height(8.dp))
                          T(tr(if (guardOn) "guard_on" else "guard_off"), 13, if (guardOn) Ui.green else Ui.red)
                          if (!guardOn) {
                              Spacer(Modifier.height(10.dp))
                              Btn(tr("enable"), {
                                  ctx.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }, filled = true)
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }

                  // ----- language -----
                  item {
                      Panel {
                          T(tr("language"), 14, Ui.dim)
                          Spacer(Modifier.height(10.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              Btn("English", { if (store.language != "en") env.setLanguage("en") }, filled = store.language == "en")
                              Btn("العربية", { if (store.language != "ar") env.setLanguage("ar") }, filled = store.language == "ar")
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }

                  // ----- widget -----
                  item {
                      Panel {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              T(tr("widget_toggle"), 14, Ui.text, Modifier.weight(1f))
                              Switch(
                                  checked = store.widgetOn,
                                  onCheckedChange = { store.widgetOn = it },
                                  colors = switchColors(),
                              )
                          }
                          Spacer(Modifier.height(10.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              Btn(tr("choose_widget"), { picker = true })
                              if (store.widgetId != -1) Btn(tr("clear_widget"), { env.clearWidget() })
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }

                  // ----- security gate -----
                  item {
                      if (!gate.unlocked) {
                          val label = if (gate.armed) tr("unlocking", gate.left) else tr("unlock")
                          Btn(label, { if (!gate.armed) gate.armed = true }, filled = true, modifier = Modifier.fillMaxWidth())
                      } else {
                          T(tr("unlocked"), 13, Ui.green)
                      }
                      Spacer(Modifier.height(16.dp))
                  }

                  // ----- gated settings -----
                  if (gate.unlocked) {
                      item {
                          Panel {
                              LabeledSlider(
                                  tr("delay_fmt", store.delaySec),
                                  store.delaySec.toFloat(), 3f..10f, 6,
                              ) { store.delaySec = it.roundToInt() }
                              LabeledSlider(
                                  tr("cooldown_fmt", store.cooldownMin),
                                  store.cooldownMin.toFloat(), 5f..60f, 54,
                              ) { store.cooldownMin = it.roundToInt() }
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  T(tr("focus_mode"), 14, Ui.text, Modifier.weight(1f))
                                  Switch(
                                      checked = store.focusMode,
                                      onCheckedChange = { store.focusMode = it },
                                      colors = switchColors(),
                                  )
                              }
                          }
                          Spacer(Modifier.height(16.dp))
                          T(tr("tiers_title"), 14, Ui.dim)
                          Spacer(Modifier.height(8.dp))
                          Field(filter, { filter = it }, tr("filter_hint"), size = 14)
                          Spacer(Modifier.height(8.dp))
                      }

                      items(shown, key = { it.pkg }) { app ->
                          val t = store.tier(app.pkg)
                          Column(Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  T(app.label, 15, Ui.text, Modifier.weight(1f), maxLines = 1)
                                  for (tier in 0..2) {
                                      TierPick(tier, t == tier) { store.setTier(app.pkg, tier) }
                                      Spacer(Modifier.width(8.dp))
                                  }
                              }
                              if (t == Tier.RED) {
                                  val q = store.quota(app.pkg)
                                  LabeledSlider(
                                      if (q == 0) tr("quota_off") else tr("quota_set", q),
                                      q / 5f, 0f..24f, 23,
                                  ) { store.setQuota(app.pkg, it.roundToInt() * 5) }
                              }
                          }
                      }
                  }
              }

              if (picker) WidgetPicker(env, onDismiss = { picker = false })
          }

          @Composable
          private fun Panel(content: @Composable ColumnScope.() -> Unit) {
              val shape = RoundedCornerShape(14.dp)
              Column(
                  Modifier.fillMaxWidth().clip(shape).background(Ui.bg).border(1.dp, Ui.border, shape).padding(16.dp),
                  content = content,
              )
          }

          @Composable
          private fun LabeledSlider(
              label: String, value: Float, range: ClosedFloatingPointRange<Float>, steps: Int, onChange: (Float) -> Unit,
          ) {
              Column(Modifier.padding(vertical = 6.dp)) {
                  T(label, 13, Ui.text)
                  Slider(value = value, onValueChange = onChange, valueRange = range, steps = steps, colors = sliderColors())
              }
          }

          @Composable
          private fun TierPick(tier: Int, selected: Boolean, onClick: () -> Unit) {
              val c = Ui.tierColor(tier)
              Box(
                  Modifier
                      .size(32.dp)
                      .clip(CircleShape)
                      .background(if (selected) c else Color.Transparent)
                      .border(2.dp, c, CircleShape)
                      .clickable(onClick = onClick)
              )
          }

          @Composable
          private fun switchColors() = SwitchDefaults.colors(
              checkedThumbColor = Color.Black,
              checkedTrackColor = Color.White,
              uncheckedThumbColor = Ui.dim,
              uncheckedTrackColor = Ui.bg,
              uncheckedBorderColor = Ui.border,
          )

          @Composable
          private fun WidgetPicker(env: Env, onDismiss: () -> Unit) {
              val ctx = LocalContext.current
              val list = remember {
                  val pm = ctx.packageManager
                  env.awm.installedProviders
                      .filter { (it.widgetCategory and AppWidgetProviderInfo.WIDGET_CATEGORY_HOME_SCREEN) != 0 }
                      .map { it to it.loadLabel(pm) }
                      .sortedBy { it.second.lowercase() }
              }
              Dialog(onDismissRequest = onDismiss) {
                  Surface(
                      shape = RoundedCornerShape(18.dp),
                      color = Ui.surface,
                      border = BorderStroke(1.dp, Ui.border),
                  ) {
                      LazyColumn(Modifier.heightIn(max = 420.dp).padding(16.dp)) {
                          items(list) { (info, label) ->
                              T(
                                  label, 15, Ui.text,
                                  Modifier.fillMaxWidth().clickable { env.pickWidget(info); onDismiss() }.padding(vertical = 12.dp),
                                  maxLines = 1,
                              )
                          }
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              private lateinit var host: AppWidgetHost
              private lateinit var awm: AppWidgetManager
              private val homeSignal = mutableIntStateOf(0)
              private var pendingId = -1

              private val bindLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == RESULT_OK) configureOrFinish(pendingId) else dropPending()
                  }
              private val configLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == RESULT_OK) finishWidget(pendingId) else dropPending()
                  }

              override fun attachBaseContext(base: Context) {
                  val locale = Locale(Store.languageOf(base))
                  Locale.setDefault(locale)
                  val cfg = Configuration(base.resources.configuration)
                  cfg.setLocale(locale)
                  cfg.setLayoutDirection(locale)
                  super.attachBaseContext(base.createConfigurationContext(cfg))
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(AColor.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(AColor.TRANSPARENT),
                  )
                  window.setBackgroundDrawable(android.graphics.drawable.ColorDrawable(AColor.parseColor("#0A0A0A")))
                  host = AppWidgetHost(this, 1024)
                  awm = AppWidgetManager.getInstance(this)
                  val store = Store.get(this)
                  val env = Env(
                      store = store,
                      host = host,
                      awm = awm,
                      homeSignal = homeSignal,
                      pickWidget = { beginWidget(it) },
                      clearWidget = { clearWidget() },
                      setLanguage = { lang -> store.language = lang; recreate() },
                  )
                  setContent {
                      val rtl = store.language == "ar"
                      CompositionLocalProvider(
                          LocalLayoutDirection provides (if (rtl) LayoutDirection.Rtl else LayoutDirection.Ltr)
                      ) {
                          FocusTheme { LauncherRoot(env) }
                      }
                  }
              }

              override fun onStart() {
                  super.onStart()
                  try { host.startListening() } catch (e: Exception) {}
              }

              override fun onStop() {
                  try { host.stopListening() } catch (e: Exception) {}
                  super.onStop()
              }

              override fun onResume() {
                  super.onResume()
                  homeSignal.intValue++
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  homeSignal.intValue++
              }

              // ---- widget hosting (AppWidgetHost) ----
              private fun beginWidget(provider: AppWidgetProviderInfo) {
                  dropPending()
                  val id = host.allocateAppWidgetId()
                  pendingId = id
                  if (awm.bindAppWidgetIdIfAllowed(id, provider.provider)) {
                      configureOrFinish(id)
                  } else {
                      val i = Intent(AppWidgetManager.ACTION_APPWIDGET_BIND)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_PROVIDER, provider.provider)
                      try { bindLauncher.launch(i) } catch (e: Exception) { dropPending() }
                  }
              }

              private fun configureOrFinish(id: Int) {
                  val info = awm.getAppWidgetInfo(id)
                  val cfg = info?.configure
                  if (cfg != null) {
                      val i = Intent(AppWidgetManager.ACTION_APPWIDGET_CONFIGURE)
                          .setComponent(cfg)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                      try { configLauncher.launch(i) } catch (e: Exception) { finishWidget(id) }
                  } else {
                      finishWidget(id)
                  }
              }

              private fun finishWidget(id: Int) {
                  val s = Store.get(this)
                  val old = s.widgetId
                  if (old != -1 && old != id) host.deleteAppWidgetId(old)
                  s.widgetId = id
                  s.widgetOn = true
                  pendingId = -1
              }

              private fun dropPending() {
                  if (pendingId != -1) host.deleteAppWidgetId(pendingId)
                  pendingId = -1
              }

              private fun clearWidget() {
                  val s = Store.get(this)
                  if (s.widgetId != -1) host.deleteAppWidgetId(s.widgetId)
                  s.widgetId = -1
                  s.widgetOn = false
              }
          }
          EOF_KOTLIN
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true -Dorg.gradle.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLauncher-apk
          path: build/outputs/apk/debug/*.apk